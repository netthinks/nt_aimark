site_name: nt-aimark
site_description: AI transparency for TYPO3 — record, label and document AI-generated content under Art. 50 of the EU AI Act
site_url: https://docs.netthinks.com/nt-aimark/

# Verweis im Seitenkopf, auf jeder Seite. Ohne ihn steht der Weg zurueck zum
# Projekt nur auf der Startseite — wer ueber eine Suchmaschine mitten in der
# Doku landet, findet weder Repository noch Anbieter.
#
# Bewusst ohne edit_uri: Ein "Diese Seite bearbeiten" passt zu einem
# Gemeinschaftsprojekt, nicht zur Dokumentation eines Produkts. Korrekturen
# kommen ueber den Issue-Tracker in der Fusszeile — dort landen sie bei uns,
# ohne dass jemand vorher an den Dateien schreibt.
repo_url: https://github.com/netthinks/nt_aimark
repo_name: netthinks/nt_aimark
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 NET.THINKS

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/netthinks.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Editorial Guide: user-guide.md
  - Rules: rules.md
  - Architecture: architecture.md
  - Metadata: metadata.md
  - Integration: integration.md
  - Developer Guide: developer.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.']
  - tables
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: de
          name: Deutsch
          build: true
          # Die Startseite von docs.netthinks.com liest die Kartentexte aus dem
          # Description-Meta der jeweiligen index.html. Ohne diese Zeile trüge
          # auch die deutsche Fassung die englische Beschreibung.
          site_description: KI-Transparenz für TYPO3 — KI-Anteil erfassen, im Frontend kennzeichnen und die Entscheidungen dokumentieren, passend zu Art. 50 der EU-KI-Verordnung
          nav_translations:
            Home: Startseite
            Installation: Installation
            Configuration: Konfiguration
            Editorial Guide: Redaktionsleitfaden
            Rules: Regelwerk
            Architecture: Architektur
            Metadata: Metadaten
            Integration: Integration
            Developer Guide: Entwicklerhandbuch
            Changelog: Changelog

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://www.netthinks.com/leistungen/websites/ki-kennzeichnung-typo3/
      name: NET.THINKS — KI-Kennzeichnung für TYPO3
    - icon: fontawesome/brands/github
      link: https://github.com/netthinks/nt_aimark
      name: Quelltext und Fehlerberichte
    - icon: fontawesome/solid/box
      link: https://extensions.typo3.org/extension/nt_aimark
      name: Im TYPO3 Extension Repository
